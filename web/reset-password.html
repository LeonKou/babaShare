<!doctype html>
<html lang="zh-CN" dir="ltr" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>babaShare · 找回密码</title>
    <script src="assets/reset-password.js"></script>
    <script src="assets/boot.js"></script>
    <link rel="stylesheet" href="assets/tokens.css" />
    <link rel="stylesheet" href="assets/components.css" />
    <link rel="stylesheet" href="assets/layout.css" />
    <link rel="stylesheet" href="assets/product-demo.css" />
  </head>
  <body class="auth-body auth-focused">
    <div class="auth-settings" id="reset-settings"></div>
    <main class="auth-panel">
      <form id="reset-form" novalidate>
        <h1 id="reset-title" data-i18n="forgotPassword">找回密码</h1>
        <p class="auth-intro" id="reset-hint" data-i18n="forgotPasswordHint">输入已验证的邮箱接收密码重置邮件。</p>
        <p class="form-note" data-i18n="required">带 * 的字段为必填项。</p>
        <div id="reset-fields"></div>
        <div id="reset-status" class="status-line" role="status" aria-live="polite"></div>
        <button type="submit" class="primary" id="reset-submit" disabled data-i18n="sendResetEmail">发送重置邮件</button>
        <p><a href="auth.html" data-i18n="login">登录</a></p>
      </form>
    </main>
    <script src="assets/i18n.js"></script>
    <script src="assets/common.js"></script>
    <script src="assets/api.js"></script>
  </body>
</html>
