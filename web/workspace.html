<!doctype html>
<html lang="zh-CN" dir="ltr" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>babaShare · 工作区</title>
    <script src="assets/boot.js"></script>
    <link rel="stylesheet" href="assets/tokens.css" />
    <link rel="stylesheet" href="assets/components.css" />
    <link rel="stylesheet" href="assets/layout.css" />
    <link rel="stylesheet" href="assets/preview.css" />
    <style>
      .workspace-operation-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-2);
        inline-size: min(100%, 600px);
        margin-inline-start: auto;
        margin-block-end: var(--space-4);
      }
      .workspace-operation-grid:not(:has(button, summary)) { display: none; }
      .workspace-action-row {
        display: grid;
        grid-column: 1 / -1;
        grid-template-columns: subgrid;
        gap: var(--space-2);
        min-inline-size: 0;
      }
      .workspace-action-row:empty { display: none; }
      /* 每一排不足三项时补齐起始空列，始终与上排的末侧边缘对齐。 */
      .workspace-action-row > :first-child:nth-last-child(2) { grid-column: 2; }
      .workspace-action-row > :only-child { grid-column: 3; }
      .page:has(#workspace-picker:not([hidden])) .workspace-operation-grid {
        margin-inline-start: 0;
        margin-inline-end: auto;
      }
      .page:has(#workspace-picker:not([hidden])) .workspace-action-row > :only-child { grid-column: 1; }
      .workspace-heading { display: flex; flex-direction: row; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
      .workspace-heading > div { min-inline-size: 0; flex: 1; overflow-wrap: anywhere; }
      .workspace-heading #file-search { margin: 0; margin-inline-start: auto; flex: 0 1 320px; align-self: flex-start; }
      .workspace-heading #file-search input { inline-size: 100%; flex: 1; }
      .page:has(#workspace-picker:not([hidden])) #file-search { display: none; }
      @media (max-width: 600px) {
        .workspace-heading { flex-wrap: wrap; }
        .workspace-heading #file-search { flex-basis: 100%; }
      }
      .workspace-action-row > button,
      .workspace-action-row > .upload-menu,
      .workspace-action-row > .upload-menu > summary {
        inline-size: 100%;
        min-inline-size: 0;
        min-block-size: 40px;
        margin: 0;
      }
      .workspace-action-row > button,
      .workspace-action-row > .upload-menu > summary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-3);
        white-space: normal;
        overflow-wrap: anywhere;
        text-align: center;
      }
      .workspace-action-row .icon { flex-shrink: 0; }
      #file-search { min-inline-size: 0; max-inline-size: 100%; }
      #file-search input { min-inline-size: 0; }
      @media (max-width: 420px) {
        .workspace-operation-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .workspace-action-row > :first-child:nth-last-child(2) { grid-column: auto; }
        .workspace-action-row > :only-child { grid-column: 2; }
        #workspace-head-actions > :first-child:nth-last-child(3) { grid-column: 2; }
      }
      .upload-menu > summary.primary {
        background: var(--color-primary);
        border-color: var(--color-primary);
        color: var(--color-on-primary);
      }
      .upload-menu > summary.primary:hover:not([aria-disabled="true"]) {
        filter: brightness(.92);
      }
      .upload-menu > summary.primary:active:not([aria-disabled="true"]) {
        filter: brightness(.85);
      }
      .upload-menu > summary.primary[aria-disabled="true"] {
        background: var(--color-menu-bg);
        border-color: var(--color-border);
        color: var(--color-menu-disabled-text);
        cursor: not-allowed;
      }
      .workspace-row-popover {
        position: fixed;
        /* 与脚本测量后的物理视口坐标一致，初始原点避免测量前撑出滚动条。 */
        top: 0;
        left: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        inline-size: 200px;
        max-inline-size: calc(100vw - var(--space-4));
        max-block-size: calc(100dvh - var(--space-4));
        overflow-y: auto;
        overflow-x: hidden;
        padding: var(--space-1);
        border: 1px solid var(--color-border);
        background: var(--color-menu-bg);
        color: var(--color-menu-text);
      }
      .workspace-row-popover button {
        flex-shrink: 0;
        block-size: 32px;
        padding-inline: var(--space-3);
        justify-content: flex-start;
        border-color: transparent;
        background: transparent;
        color: var(--color-menu-text);
      }
      .workspace-row-popover button:hover {
        background: var(--color-menu-hover-bg);
        color: var(--color-menu-hover-text);
      }
      .workspace-row-popover button:active {
        background: var(--color-menu-active-bg);
        color: var(--color-menu-active-text);
      }
      .workspace-row-popover button:focus-visible {
        outline: 2px solid var(--color-border-focus);
        outline-offset: -2px;
      }
      .workspace-row-popover button:disabled {
        color: var(--color-menu-disabled-text);
        cursor: not-allowed;
      }
      .workspace-row-popover button.danger { color: var(--color-danger); }
    </style>
  </head>
  <body>
    <div class="member-layout" id="workspace-layout">
      <main class="page">
        <nav
          class="crumbs"
          aria-label="面包屑"
          data-i18n-label="breadcrumb"
          id="breadcrumbs"
        >
          <ol>
            <li aria-current="page" data-i18n="workspaces">工作区</li>
          </ol>
        </nav>
        <header class="page-head workspace-heading">
          <div>
            <div class="files-heading">
              <h1 id="workspace-title" data-i18n="workspaces">工作区</h1>
              <span id="workspace-role" class="badge" hidden></span>
            </div>
            <p
              class="muted small"
              id="workspace-subtitle"
              data-i18n="workspaceHint"
            >
              为设计与协作创建一个专属空间。
            </p>
          </div>
          <form id="file-search" class="search">
            <label class="sr-only" for="search-input" data-i18n="search">搜索文件名</label>
            <input type="search" id="search-input" data-i18n-placeholder="search" placeholder="搜索文件名" />
            <button type="submit" data-i18n="searchButton">搜索</button>
          </form>
        </header>
        <div class="workspace-operation-grid" role="group" aria-label="操作" data-i18n-label="actions">
          <div class="workspace-action-row" id="workspace-head-actions" role="group" aria-label="工作区" data-i18n-label="workspace"></div>
          <div class="workspace-action-row" id="file-actions" role="group" aria-label="文件列表" data-i18n-label="fileList"></div>
        </div>
        <section id="workspace-picker" hidden>
          <div class="cards" id="workspace-cards"></div>
        </section>
        <section id="file-browser" hidden>
          <div class="pagination" id="file-pagination"></div>
          <div
            id="file-status"
            class="status-line"
            role="status"
            aria-live="polite"
          ></div>
          <div
            class="table-wrap"
            role="region"
            aria-label="文件列表"
            data-i18n-label="fileList"
            id="file-table-wrap"
            tabindex="0"
          >
            <table id="file-table">
              <thead>
                <tr>
                  <th scope="col">
                    <button
                      type="button"
                      class="sort-button"
                      id="sort-name"
                      data-i18n="name"
                    >
                      名称
                    </button>
                  </th>
                  <th scope="col" data-i18n="type">类型</th>
                  <th scope="col">
                    <button
                      type="button"
                      class="sort-button"
                      id="sort-size"
                      data-i18n="size"
                    >
                      大小
                    </button>
                  </th>
                  <th scope="col">
                    <button
                      type="button"
                      class="sort-button"
                      id="sort-time"
                      data-i18n="modified"
                    >
                      最后修改
                    </button>
                  </th>
                  <th scope="col" data-i18n="actions">操作</th>
                </tr>
              </thead>
              <tbody id="file-list"></tbody>
            </table>
          </div>
          <div id="file-empty" hidden></div>
          <div id="personal-quota" class="section" role="status" aria-live="polite"></div>
          <div class="upload-zone" id="drop-zone">
            <span id="drop-icon"></span
            ><span data-i18n="uploadHint"
              >将多个文件拖放到这里，或使用上方上传按钮。</span
            >
          </div>
          <input type="file" id="upload-input" multiple hidden /><input
            type="file"
            id="directory-input"
            multiple
            webkitdirectory
            hidden
          />
        </section>
        <div
          id="workspace-status"
          class="status-line"
          role="status"
          aria-live="polite"
        ></div>
      </main>
      <aside class="members-panel" id="members-panel">
        <div class="toolbar">
          <h2 data-i18n="members">成员</h2>
          <span class="badge num" id="member-count">0</span>
        </div>
        <p class="muted small" data-i18n="memberHint">
          工作区成员可访问这里的所有文件。
        </p>
        <ul class="member-list" id="member-list"></ul>
        <div id="member-actions" class="actions member-actions"></div>
        <div class="workspace-note">
          <p data-i18n="securityHint">
            上传的页面在沙盒中运行，分享链接可随时撤销。
          </p>
        </div>
      </aside>
    </div>
    <div id="global-toast" class="toast" role="status" aria-live="polite"></div>
    <script src="assets/i18n.js"></script>
    <script src="assets/bridge-core.js"></script>
    <script src="assets/page-bridge.js"></script>
    <script src="assets/common.js"></script>
    <script src="assets/api.js"></script>
    <script src="assets/pagination.js"></script>
    <script src="assets/preview.js"></script>
    <script src="assets/onboarding-feedback.js"></script>
    <script src="assets/workspace.js"></script>
  </body>
</html>
