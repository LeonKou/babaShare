<!doctype html>
<html lang="zh-CN" dir="ltr" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>babaShare · 空间管理</title>
    <script src="assets/boot.js"></script>
    <link rel="stylesheet" href="assets/tokens.css" />
    <link rel="stylesheet" href="assets/components.css" />
    <link rel="stylesheet" href="assets/layout.css" />
    <style>
      #admin-search{min-inline-size:0;margin-block-end:var(--space-4)}
      #admin-filters{min-inline-size:0}
      #admin-filters>summary{cursor:pointer;min-block-size:32px;overflow-wrap:anywhere}
      #admin-filter-summary{margin-inline-start:var(--space-2);color:var(--color-text-secondary)}
      .admin-filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:var(--space-4);margin-block-start:var(--space-4)}
      #admin-search .field{min-inline-size:0;margin:0}
      #admin-search .field>label{overflow-wrap:anywhere}
      #admin-search .field>input,#admin-search .field>select{inline-size:100%;min-inline-size:0;max-inline-size:100%}
      #admin-search .actions{display:flex;flex-wrap:wrap;gap:var(--space-2);justify-content:flex-end;margin-block-start:var(--space-4)}
      #admin-search .actions>button{white-space:normal;overflow-wrap:anywhere;max-inline-size:100%}
    </style>
  </head>
  <body>
    <main class="page">
      <nav class="crumbs" aria-label="面包屑" data-i18n-label="breadcrumb"><ol>
        <li><a href="index.html" data-i18n="home">首页</a></li>
        <li aria-current="page" data-i18n="workspace-admin">空间管理</li>
      </ol></nav>
      <header class="page-head"><div>
        <h1 data-i18n="workspace-admin">空间管理</h1>
        <p class="muted small" data-i18n="workspaceAdminHint">管理所有账户与系统托管的空间，文件始终保留。</p>
      </div></header>
      <div id="admin-status" class="status-line" role="status" aria-live="polite"></div>
      <form id="admin-search" class="card">
        <details id="admin-filters">
          <summary><span data-i18n="workspaceFilters">搜索条件</span><span id="admin-filter-summary" aria-live="polite"></span></summary>
          <div class="admin-filter-grid">
            <div class="field"><label for="admin-user" data-i18n="userAssociation">关联账户</label>
              <select id="admin-user" name="userId"></select></div>
            <div class="field"><label for="admin-relation" data-i18n="associationType">关联方式</label>
              <select id="admin-relation" name="relation">
                <option value="any" data-i18n="associationAny">所有者或成员</option>
                <option value="owner" data-i18n="associationOwner">仅所有者</option>
                <option value="member" data-i18n="associationMember">仅成员</option>
              </select></div>
            <div class="field"><label for="admin-owner" data-i18n="ownerStatus">归属状态</label>
              <select id="admin-owner" name="ownerStatus">
                <option value="all" data-i18n="allOwners">全部归属</option>
                <option value="system" data-i18n="systemCustody">系统托管</option>
                <option value="account" data-i18n="accountOwned">账户所有</option>
              </select></div>
            <div class="field"><label for="admin-query" data-i18n="workspaceSearch">空间名称前缀</label>
              <input id="admin-query" name="search" type="search" maxlength="100" /></div>
            <div class="field"><label for="admin-creator" data-i18n="creatorSearch">创建人名称前缀</label>
              <input id="admin-creator" name="creator" type="search" maxlength="64" /></div>
          </div>
          <div class="actions">
            <button id="admin-reset" type="button" data-i18n="resetFilters">重置</button>
            <button type="submit" class="primary" data-i18n="searchButton">搜索</button>
          </div>
        </details>
      </form>
      <div id="admin-pagination" class="pagination"></div>
      <div id="admin-cards" class="cards"></div>
      <div id="admin-empty" hidden></div>
    </main>
    <div id="global-toast" class="toast" role="status" aria-live="polite"></div>
    <script src="assets/i18n.js"></script>
    <script src="assets/bridge-core.js"></script>
    <script src="assets/page-bridge.js"></script>
    <script src="assets/common.js"></script>
    <script src="assets/api.js"></script>
    <script src="assets/pagination.js"></script>
    <script src="assets/workspace-admin.js"></script>
  </body>
</html>
